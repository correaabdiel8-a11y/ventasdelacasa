<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Casa del Chef · Ventas</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#16130f;--mut:#7a7367;--gold:#a8842f;--gold-l:#f1e8d0;--line:#e4dfd5;--ok:#2f7d4f;--err:#b3382c}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
h1,h2,h3,.brand{font-family:Georgia,"Times New Roman",serif;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:var(--ink);color:#fff;font-weight:600}.btn.gold{background:var(--gold)}
.btn.big{padding:16px 22px;font-size:17px;width:100%}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}.danger{color:var(--err)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.app{display:flex;min-height:100vh}
aside{width:230px;background:var(--ink);color:#e9e4d8;padding:24px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{font-size:21px;color:var(--gold);padding:0 10px 22px;line-height:1.2}.brand small{display:block;font:12px system-ui;color:#8d8577;margin-top:4px}
nav{flex:1;display:flex;flex-direction:column;gap:4px}
nav button{background:transparent;color:#cfc8ba;text-align:left;display:flex;gap:12px;align-items:center;padding:12px}
nav button.on{background:#2a251d;color:var(--gold)}
.me{font-size:13px;padding:10px;color:#a39b8b}.me button{margin-top:8px;width:100%;background:#2a251d;color:#e9e4d8}
main{flex:1;padding:28px;max-width:1200px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:28px}h3{font-size:18px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:16px}
.k{color:var(--mut);font-size:13px}.v{font-family:Georgia,serif;font-size:28px;margin-top:6px}
.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{background:transparent;padding:8px 14px}.seg button.on{background:#fff;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600}tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
.r{text-align:right}.tw{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:4px;height:190px}
.bar{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}.bar .t{flex:1;display:flex;align-items:flex-end}
.bar i{width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}.bar span{font-size:10px;color:var(--mut);text-align:center;margin-top:4px}
.sale{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.chips button{white-space:nowrap;background:#fff;border:1px solid var(--line)}
.chips button.on{background:var(--ink);color:#fff}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.p{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.p:active{transform:scale(.98)}.p .im{height:78px;background:var(--gold-l);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:28px;color:var(--gold);background-size:cover;background-position:center}
.p div.b{padding:10px 12px}.p b{display:block;font-weight:600;line-height:1.25}.p em{font-style:normal;color:var(--gold);font-weight:700}
.cart{position:sticky;top:16px}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.qty{display:flex;gap:4px;align-items:center}.qty button{padding:4px 10px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pay button{background:#fff;border:1px solid var(--line);padding:12px 4px}.pay button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.tot{display:flex;justify-content:space-between;font-family:Georgia,serif;font-size:26px;margin:12px 0}
.ov{position:fixed;inset:0;background:rgba(22,19,15,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
.tag{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--gold-l);color:var(--gold)}.tag.off{background:#eee;color:var(--mut)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:20}
.err{color:var(--err);font-size:13px;margin-top:8px}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login .brand{color:var(--gold);font-size:30px;padding:0 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
@media(max-width:860px){
 aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px;z-index:8;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
 .brand,.me{display:none}nav{flex-direction:row;justify-content:space-around}nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;text-align:center;flex:1}
 main{padding:16px 14px calc(90px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
 .sale{grid-template-columns:1fr}.cart{position:static}.mo{display:block!important}
}
.mo{display:none;margin-bottom:12px}
</style></head><body>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<div id="root"></div><div id="modal"></div><div id="toast"></div>
<script>
const K='cdc_ventas_v1',CATS=['PAN DE MESA','BOLLERÍA','REPOSTERÍA','PAN DE TEMPORADA','OTROS'],PAYS=['Efectivo','Tarjeta','Transferencia'];
// ===== PRODUCTOS INICIALES (43): [nombre, índice de categoría, precio]. Cámbialos aquí antes del primer uso. =====
const SEED=[
['Baguette',0,35],['Pan de caja',0,48],['Pan integral',0,52],['Ciabatta',0,30],['Focaccia',0,45],['Pan de centeno',0,55],['Bolillo',0,6],['Telera',0,8],['Masa madre',0,85],
['Concha',1,20],['Croissant',1,30],['Cuerno',1,22],['Oreja',1,25],['Pan de chocolate',1,38],['Rol de canela',1,40],['Empanada de cajeta',1,28],['Polvorón',1,15],['Panqué',1,32],['Danés',1,36],
['Brownie',2,35],['Cheesecake rebanada',2,75],['Pastel de chocolate',2,70],['Tarta de frutas',2,65],['Galleta de avena',2,18],['Cupcake',2,42],['Éclair',2,45],['Macarrón',2,30],['Tres leches',2,68],['Mil hojas',2,60],
['Pan de muerto',3,45],['Rosca de reyes',3,60],['Buñuelo',3,30],['Pan de elote',3,40],['Pay de calabaza',3,62],['Panettone rebanada',3,55],['Pan de nata',3,38],
['Café americano',4,35],['Capuchino',4,48],['Chocolate caliente',4,45],['Jugo natural',4,40],['Agua embotellada',4,20],['Mermelada',4,95],['Mantequilla',4,70]];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('es-MX',{style:'currency',currency:'MXN'}),fd=i=>i.split('-').reverse().join('/');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cdc|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let db=null,S={user:null,view:'dash',cart:[],pay:'Efectivo',cat:'Todas',q:'',per:'hoy',hf:{d1:'',d2:'',m:'',q:''},img:''};
const NAV=[['dash','▦','Dashboard'],['venta','＋','Nueva venta'],['prod','▤','Productos'],['hist','☰','Historial','a'],['rep','◔','Reportes','a'],['conf','⚙','Configuración','a']];
const isA=()=>S.user&&S.user.rol==='ADMINISTRADOR';
// ===== FIREBASE =====
// Pega aquí tu configuración (Firebase Console → Configuración del proyecto → Tus apps → SDK)
const FIREBASE_CONFIG={
  apiKey:"AIzaSyBlFDJH2JxtW6TWWfP_wk0YnW7dJTbHDuM",
  authDomain:"la-casa-del-cheff.firebaseapp.com",
  projectId:"la-casa-del-cheff",
  storageBucket:"la-casa-del-cheff.firebasestorage.app",
  messagingSenderId:"344447580222",
  appId:"1:344447580222:web:138544c5f12eb96b99f96f"};
const DOMINIO='@lacasadelchef.app',ADMIN_EMAIL='admin'+DOMINIO,em=u=>u.trim().toLowerCase().replace(/\s+/g,'')+DOMINIO,pad=n=>'P'+String(n).padStart(3,'0');
let fs,auth,unsubs=[];
function init(){
 db={products:[],sales:[],users:[]};S.loading=true;render();
 if(!FIREBASE_CONFIG.apiKey){S.loading=false;$('root').innerHTML='<div class="login"><div class="brand">Falta configurar Firebase</div><p class="k">Pega tu configuración en FIREBASE_CONFIG dentro del código.</p></div>';return}
 firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
 auth.onAuthStateChanged(async u=>{unsubs.forEach(f=>f());unsubs=[];
  if(!u){S.user=null;S.loading=false;render();return}
  try{
   let d=await fs.collection('users').doc(u.uid).get();
   if(!d.exists&&u.email===ADMIN_EMAIL){await bootstrap(u);d=await fs.collection('users').doc(u.uid).get()}
   if(!d.exists||d.data().activo===false){S.loginErr='Tu usuario no tiene acceso. Habla con el administrador.';await auth.signOut();return}
   S.user={id:u.uid,...d.data()};S.loading=false;S.view='dash';S.per='hoy';S.loginErr='';render();listen()
  }catch(e){console.error(e);S.loginErr='No se pudo conectar. Revisa tu internet y las reglas de Firestore.';S.loading=false;S.user=null;render()}})}
// Primer ingreso del admin: crea su perfil, los 43 productos y el usuario vendedor
async function bootstrap(u){
 await fs.collection('users').doc(u.uid).set({nombre:'Administrador',usuario:'admin',rol:'ADMINISTRADOR',activo:true});
 if((await fs.collection('products').limit(1).get()).empty){const b=fs.batch();SEED.forEach((p,i)=>b.set(fs.collection('products').doc(pad(i+1)),{id:pad(i+1),nombre:p[0],categoria:CATS[p[1]],precio:p[2],descripcion:'',imagen:'',activo:true}));await b.commit()}
 try{await mkUser('venta','Vendedor','ventas2026','VENDEDOR')}catch(e){console.warn(e)}}
// Crea usuarios con una segunda instancia para no cerrar la sesión del admin
async function mkUser(us,nombre,pw,rol){const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
 const c=await sec.auth().createUserWithEmailAndPassword(em(us),pw);
 try{await fs.collection('users').doc(c.user.uid).set({nombre,usuario:us,rol,activo:true})}finally{await sec.auth().signOut()}}
function listen(){const sl=fs.collection('sales');
 unsubs.push(fs.collection('products').onSnapshot(s=>{db.products=s.docs.map(x=>x.data()).sort((a,b)=>a.id<b.id?-1:1);refresh()}));
 unsubs.push((isA()?sl:sl.where('fecha','==',iso(new Date()))).onSnapshot(s=>{db.sales=s.docs.map(x=>x.data()).sort((a,b)=>a.id-b.id);refresh()}));
 if(isA())unsubs.push(fs.collection('users').onSnapshot(s=>{db.users=s.docs.map(x=>({id:x.id,...x.data()}));refresh()}))}
function refresh(){if(!S.user)return;const v=S.view;
 if(v==='venta'){S.cart=S.cart.filter(c=>prod(c.id)&&prod(c.id).activo);grid();cart();return}
 if($('modal').innerHTML)return;({dash:vDash,prod:vProd,hist:hRows,rep:vRep,conf:vConf})[v]()}
function toast(t){$('toast').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('toast').innerHTML='',2600)}
function modal(h){$('modal').innerHTML='<div class="ov" onclick="if(event.target===this)closeM()"><div class="md">'+h+'</div></div>'}
function closeM(){$('modal').innerHTML=''}
// ===== Sesión =====
async function login(){const us=$('le').value,p=$('lp').value;S.loginErr='';
 if(!us.trim()||!p){$('lerr').textContent='Escribe tu usuario y contraseña.';return}
 try{await auth.signInWithEmailAndPassword(em(us),p)}catch(e){$('lerr').textContent='Usuario o contraseña incorrectos.'}}
function logout(){S.cart=[];auth.signOut()}
function go(v){if(NAV.find(n=>n[0]===v)[3]&&!isA())return;S.view=v;render()}
function render(){
 if(S.loading){$('root').innerHTML='<p class="k" style="padding:40px">Cargando…</p>';return}
 if(!S.user){$('root').innerHTML='<div class="login"><div class="brand">La Casa del Chef</div><p class="k">Control de ventas · acceso del personal</p><div class="card" style="margin-top:20px"><label>Usuario</label><input id="le" autocomplete="username" autocapitalize="none"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')login()"><div class="err" id="lerr">'+(S.loginErr||'')+'</div><button class="btn big gold" style="margin-top:16px" onclick="login()">Entrar</button></div></div>';return}
 const nav=NAV.filter(n=>!n[3]||isA()).map(n=>`<button class="${S.view===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
 $('root').innerHTML=`<div class="app"><aside><div class="brand">La Casa del Chef<small>Control de ventas</small></div><nav>${nav}</nav><div class="me">${esc(S.user.nombre)}<br>${S.user.rol==='ADMINISTRADOR'?'Administrador':'Vendedor'}<button onclick="logout()">Cerrar sesión</button></div></aside><main id="main"></main></div>`;
 ({dash:vDash,venta:vVenta,prod:vProd,hist:vHist,rep:vRep,conf:vConf})[S.view]()}
// ===== Utilidades de datos =====
function range(p){const t=new Date(),d=n=>{const x=new Date(t);x.setDate(x.getDate()-n);return iso(x)};
 return p==='hoy'?[d(0),d(0)]:p==='ayer'?[d(1),d(1)]:p==='7d'?[d(6),d(0)]:[iso(new Date(t.getFullYear(),t.getMonth(),1)),d(0)]}
const salesIn=p=>{const[a,b]=range(p);return db.sales.filter(s=>s.fecha>=a&&s.fecha<=b)};
function stats(L){const tot=L.reduce((a,s)=>a+s.total,0),pr={},me={};let u=0;
 L.forEach(s=>{me[s.metodo]=(me[s.metodo]||0)+s.total;s.items.forEach(i=>{u+=i.cant;pr[i.nombre]=(pr[i.nombre]||0)+i.cant})});
 const top=Object.entries(pr).sort((a,b)=>b[1]-a[1]),mm=Object.entries(me).sort((a,b)=>b[1]-a[1]);
 return{tot,n:L.length,u,avg:L.length?tot/L.length:0,top,me:mm}}
function bars(d){const m=Math.max(...d.map(x=>x[1]),1);return'<div class="bars">'+d.map(x=>`<div class="bar" title="${esc(x[0])}: ${money(x[1])}"><div class="t"><i style="height:${x[1]/m*100}%"></i></div><span>${esc(x[2])}</span></div>`).join('')+'</div>'}
function series(L,p){const m={},out=[];
 if(p==='hoy'||p==='ayer'){for(let h=6;h<=22;h++)m[h]=0;L.forEach(s=>{const h=+s.hora.slice(0,2);m[h]=(m[h]||0)+s.total});return Object.keys(m).map(h=>[h+':00',m[h],h])}
 const[a,b]=range(p);for(let d=new Date(a+'T12:00');iso(d)<=b;d.setDate(d.getDate()+1))m[iso(d)]=0;
 L.forEach(s=>m[s.fecha]=(m[s.fecha]||0)+s.total);return Object.keys(m).map(k=>[fd(k),m[k],k.slice(8)])}
function seg(cur,fn){return'<div class="seg">'+[['hoy','Hoy'],['ayer','Ayer'],['7d','Últimos 7 días'],['mes','Este mes']].map(x=>`<button class="${cur===x[0]?'on':''}" onclick="${fn}('${x[0]}')">${x[1]}</button>`).join('')+'</div>'}
const itemsTxt=s=>s.items.map(i=>i.cant+'× '+i.nombre).join(', ');
// ===== Dashboard =====
function vDash(){if(!isA())S.per='hoy';const L=salesIn(S.per),s=stats(L),last=[...L].reverse().slice(0,8);
 $('main').innerHTML=`<div class="top"><h1>Dashboard</h1>${isA()?seg(S.per,'setPer'):'<span class="tag">Ventas de hoy</span>'}</div>
 <div class="grid4"><div class="card"><div class="k">Ventas</div><div class="v">${money(s.tot)}</div></div><div class="card"><div class="k">Ventas realizadas</div><div class="v">${s.n}</div></div><div class="card"><div class="k">Productos vendidos</div><div class="v">${s.u}</div></div><div class="card"><div class="k">Ticket promedio</div><div class="v">${money(s.avg)}</div></div></div>
 <div class="grid2"><div class="card"><h3>Ventas</h3>${s.n?bars(series(L,S.per)):'<p class="k">Aún no hay ventas en este período.</p>'}</div>
 <div class="card"><h3>Productos más vendidos</h3>${s.top.length?s.top.slice(0,6).map((t,i)=>`<div class="row"><span>${i+1}. ${esc(t[0])}</span><b>${t[1]} unidades</b></div>`).join(''):'<p class="k">Sin datos todavía.</p>'}</div></div>
 <div class="card"><div class="top" style="margin:0 0 8px"><h3 style="margin:0">Últimas ventas</h3><button class="btn gold" onclick="go('venta')">+ Nueva venta</button></div>${last.length?'<div class="tw"><table>'+last.map(x=>`<tr class="click" onclick="detail(${x.id})"><td>#${x.id}</td><td>${x.hora}</td><td>${esc(itemsTxt(x))}</td><td>${x.metodo}</td><td class="r"><b>${money(x.total)}</b></td></tr>`).join('')+'</table></div>':'<p class="k">Registra tu primera venta con “+ Nueva venta”.</p>'}</div>`}
function setPer(p){S.per=p;vDash()}
// ===== Nueva venta =====
const prod=id=>db.products.find(p=>p.id===id),cartTot=()=>S.cart.reduce((a,c)=>a+c.q*prod(c.id).precio,0);
function vVenta(){$('main').innerHTML=`<div class="top"><h1>Nueva venta</h1></div><div class="sale"><div><input id="sq" placeholder="Buscar producto…" value="${esc(S.q)}" oninput="S.q=this.value;grid()"><div class="chips" id="chips"></div><div class="prods" id="grid"></div></div><div class="card cart" id="cart"></div></div>`;chips();grid();cart()}
function chips(){$('chips').innerHTML=['Todas',...CATS].map(c=>`<button class="${S.cat===c?'on':''}" onclick="S.cat=this.dataset.c;chips();grid()" data-c="${c}">${c==='Todas'?'Todas':c}</button>`).join('')}
function grid(){const q=S.q.toLowerCase(),L=db.products.filter(p=>p.activo&&(S.cat==='Todas'||p.categoria===S.cat)&&p.nombre.toLowerCase().includes(q));
 $('grid').innerHTML=L.length?L.map(p=>`<button class="p" onclick="add('${p.id}')"><div class="im" style="${p.imagen?`background-image:url('${esc(p.imagen)}')`:''}">${p.imagen?'':esc(p.nombre[0])}</div><div class="b"><b>${esc(p.nombre)}</b><em>${money(p.precio)}</em></div></button>`).join(''):'<p class="k">No hay productos que coincidan.</p>'}
function add(id){const c=S.cart.find(x=>x.id===id);c?c.q++:S.cart.push({id,q:1});cart()}
function qty(id,d){const c=S.cart.find(x=>x.id===id);c.q+=d;if(c.q<1)S.cart=S.cart.filter(x=>x!==c);cart()}
function rm(id){S.cart=S.cart.filter(x=>x.id!==id);cart()}
function clr(){S.cart=[];cart()}
function cart(){$('cart').innerHTML=`<h3>Venta actual</h3>`+(S.cart.length?S.cart.map(c=>{const p=prod(c.id);return`<div class="li"><div><b>${esc(p.nombre)}</b><div class="k">${c.q} × ${money(p.precio)} = ${money(c.q*p.precio)}</div></div><div class="qty"><button onclick="qty('${c.id}',-1)" aria-label="Menos">−</button><b>${c.q}</b><button onclick="qty('${c.id}',1)" aria-label="Más">+</button><button class="danger" onclick="rm('${c.id}')" aria-label="Quitar">✕</button></div></div>`}).join(''):'<p class="k" style="padding:10px 0">Toca un producto para agregarlo.</p>')+
 `<div class="tot"><span>Total</span><b>${money(cartTot())}</b></div><div class="k">Método de pago</div><div class="pay">${PAYS.map(m=>`<button class="${S.pay===m?'on':''}" onclick="S.pay='${m}';cart()">${m}</button>`).join('')}</div><button class="btn gold big" onclick="review()">Cobrar</button>${S.cart.length?'<button class="btn ghost" style="width:100%;margin-top:8px" onclick="clr()">Vaciar venta</button>':''}`}
function review(){if(!S.cart.length){toast('Agrega al menos un producto para registrar la venta.');return}
 modal(`<h2>Confirmar venta</h2><div style="margin:14px 0">${S.cart.map(c=>{const p=prod(c.id);return`<div class="row"><span>${c.q} × ${esc(p.nombre)}</span><span>${money(c.q*p.precio)}</span></div>`}).join('')}</div><div class="tot"><span>Total</span><b>${money(cartTot())}</b></div><div class="row"><span class="k">Método de pago</span><b>${S.pay}</b></div><button class="btn gold big" style="margin-top:16px" onclick="confirmSale()">Confirmar venta</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeM()">Volver</button>`)}
async function confirmSale(){const items=S.cart.filter(c=>c.q>=1&&prod(c.id)).map(c=>{const p=prod(c.id);return{productoId:p.id,nombre:p.nombre,cant:c.q,precio:p.precio,sub:c.q*p.precio}});
 if(!items.length)return;const btn=event&&event.target;if(btn)btn.disabled=true;
 try{const ref=fs.collection('meta').doc('counters');
  const id=await fs.runTransaction(async t=>{const d=await t.get(ref),n=d.exists?d.data().nextSale:1;t.set(ref,{nextSale:n+1},{merge:true});return n});
  const n=new Date(),s={id,fecha:iso(n),hora:n.toTimeString().slice(0,5),userId:S.user.id,vendedor:S.user.nombre,metodo:S.pay,total:items.reduce((a,i)=>a+i.sub,0),items};
  await fs.collection('sales').doc(String(id)).set(s);S.cart=[];
  modal(`<div style="text-align:center"><div style="font-size:44px;color:var(--ok)">✓</div><h2>Venta registrada correctamente</h2><p class="k" style="margin:8px 0 18px">Venta #${s.id} · ${money(s.total)} · ${s.metodo}</p><button class="btn gold big" onclick="closeM();vVenta()">Registrar otra venta</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeM();go('dash')">Ver dashboard</button></div>`)
 }catch(e){console.error(e);if(btn)btn.disabled=false;toast('No se pudo registrar la venta. Revisa tu conexión e inténtalo de nuevo.')}}
function detail(id){const s=db.sales.find(x=>x.id===id),u=s.vendedor?{nombre:s.vendedor}:null;
 modal(`<h2>Venta #${s.id}</h2><p class="k">${fd(s.fecha)} · ${s.hora}${u?' · '+esc(u.nombre):''}</p><div style="margin:14px 0">${s.items.map(i=>`<div class="row"><span>${i.cant} × ${esc(i.nombre)} <span class="k">(${money(i.precio)})</span></span><span>${money(i.sub)}</span></div>`).join('')}</div><div class="tot"><span>Total</span><b>${money(s.total)}</b></div><div class="row"><span class="k">Método de pago</span><b>${s.metodo}</b></div><button class="btn" style="width:100%;margin-top:14px" onclick="closeM()">Cerrar</button>`)}
// ===== Productos =====
function vProd(){const a=isA();$('main').innerHTML=`<div class="top"><h1>Productos</h1>${a?'<button class="btn gold" onclick="pForm()">+ Nuevo producto</button>':''}</div><div class="card"><div class="tw"><table><tr><th>ID</th><th>Producto</th><th>Categoría</th><th class="r">Precio</th><th>Estado</th>${a?'<th></th>':''}</tr>${db.products.map(p=>`<tr><td class="k">${p.id}</td><td><b>${esc(p.nombre)}</b><div class="k">${esc(p.descripcion)}</div></td><td>${p.categoria}</td><td class="r">${money(p.precio)}</td><td><span class="tag ${p.activo?'':'off'}">${p.activo?'Activo':'Inactivo'}</span></td>${a?`<td class="r"><button class="btn sm" onclick="pForm('${p.id}')">Editar</button> <button class="btn sm ghost" onclick="pTog('${p.id}')">${p.activo?'Desactivar':'Activar'}</button></td>`:''}</tr>`).join('')}</table></div></div>`}
function pForm(id){if(!isA())return;const p=id?prod(id):{nombre:'',categoria:CATS[0],precio:'',descripcion:'',imagen:'',activo:true};S.img=p.imagen;
 modal(`<h2>${id?'Editar':'Nuevo'} producto</h2><label>Nombre</label><input id="fn" value="${esc(p.nombre)}"><div class="two"><div><label>Categoría</label><select id="fc">${CATS.map(c=>`<option ${c===p.categoria?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Precio (MXN)</label><input id="fp" type="number" min="0.01" step="0.5" value="${p.precio}"></div></div><label>Descripción</label><input id="fd" value="${esc(p.descripcion)}"><label>Imagen (opcional)</label><input type="file" accept="image/*" onchange="pImg(this)"><label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="fa" style="width:auto" ${p.activo?'checked':''}> Activo (aparece al vender)</label><div class="err" id="ferr"></div><button class="btn gold big" style="margin-top:14px" onclick="pSave('${id||''}')">Guardar producto</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeM()">Cancelar</button>`)}
function pImg(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,320/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.img=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}
async function pSave(id){const n=$('fn').value.trim(),pr=parseFloat($('fp').value);
 if(!n){$('ferr').textContent='Escribe el nombre del producto.';return}if(!(pr>0)){$('ferr').textContent='El precio debe ser mayor a $0.';return}
 const d={nombre:n,categoria:$('fc').value,precio:pr,descripcion:$('fd').value.trim(),imagen:S.img||'',activo:$('fa').checked};
 try{if(id)await fs.collection('products').doc(id).update(d);else{const nid=pad(Math.max(0,...db.products.map(p=>+p.id.slice(1)))+1);await fs.collection('products').doc(nid).set({id:nid,...d})}
 closeM();toast('Producto guardado')}catch(e){$('ferr').textContent='No se pudo guardar. Revisa tu conexión.'}}
function pTog(id){if(!isA())return;S.cart=S.cart.filter(c=>c.id!==id);fs.collection('products').doc(id).update({activo:!prod(id).activo})}
// ===== Historial =====
function vHist(){$('main').innerHTML=`<div class="top"><h1>Historial de ventas</h1></div><div class="card"><div class="filters"><input id="hq" placeholder="Buscar # o producto" value="${esc(S.hf.q)}" oninput="S.hf.q=this.value;hRows()"><div><input id="h1" type="date" value="${S.hf.d1}" onchange="S.hf.d1=this.value;hRows()" title="Desde"></div><div><input id="h2" type="date" value="${S.hf.d2}" onchange="S.hf.d2=this.value;hRows()" title="Hasta"></div><select onchange="S.hf.m=this.value;hRows()"><option value="">Todos los pagos</option>${PAYS.map(m=>`<option ${S.hf.m===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="tw"><table><tr><th>Fecha</th><th>Hora</th><th>Venta</th><th>Productos</th><th>Pago</th><th class="r">Total</th></tr><tbody id="hb"></tbody></table></div><p class="k" id="hs" style="margin-top:10px"></p></div>`;hRows()}
function hRows(){const f=S.hf,q=f.q.toLowerCase().replace('#','');
 const L=db.sales.filter(s=>(!f.d1||s.fecha>=f.d1)&&(!f.d2||s.fecha<=f.d2)&&(!f.m||s.metodo===f.m)&&(!q||String(s.id)===q||itemsTxt(s).toLowerCase().includes(q))).reverse();
 $('hb').innerHTML=L.slice(0,300).map(s=>`<tr class="click" onclick="detail(${s.id})"><td>${fd(s.fecha)}</td><td>${s.hora}</td><td>#${s.id}</td><td>${esc(itemsTxt(s))}</td><td>${s.metodo}</td><td class="r"><b>${money(s.total)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="k">No hay ventas con estos filtros.</td></tr>';
 $('hs').textContent=L.length+' ventas · '+money(L.reduce((a,s)=>a+s.total,0))+(L.length>300?' (se muestran las 300 más recientes)':'')}
// ===== Reportes =====
function vRep(){const L=salesIn(S.per),s=stats(L),mt=Math.max(...s.me.map(m=>m[1]),1);
 $('main').innerHTML=`<div class="top"><h1>Reportes</h1>${seg(S.per,'setRep')}</div>
 <div class="grid4"><div class="card"><div class="k">Ventas del período</div><div class="v">${money(s.tot)}</div></div><div class="card"><div class="k">Promedio por venta</div><div class="v">${money(s.avg)}</div></div><div class="card"><div class="k">Producto más vendido</div><div class="v">${s.top[0]?esc(s.top[0][0]):'—'}</div></div><div class="card"><div class="k">Pago más utilizado</div><div class="v">${s.me[0]?s.me[0][0]:'—'}</div></div></div>
 <div class="card" style="margin-bottom:16px"><h3>Ventas por ${S.per==='hoy'||S.per==='ayer'?'hora':'día'}</h3>${s.n?bars(series(L,S.per)):'<p class="k">No hay ventas en este período.</p>'}</div>
 <div class="grid2"><div class="card"><h3>Ventas por método de pago</h3>${s.me.length?s.me.map(m=>`<div style="margin:10px 0"><div class="row"><span>${m[0]}</span><b>${money(m[1])}</b></div><div style="background:var(--line);border-radius:6px;height:8px"><div style="background:var(--gold);height:8px;border-radius:6px;width:${m[1]/mt*100}%"></div></div></div>`).join(''):'<p class="k">Sin datos.</p>'}</div>
 <div class="card"><h3>Productos más vendidos</h3>${s.top.slice(0,10).map((t,i)=>`<div class="row"><span>${i+1}. ${esc(t[0])}</span><b>${t[1]}</b></div>`).join('')||'<p class="k">Sin datos.</p>'}</div></div>`}
function setRep(p){S.per=p;vRep()}
// ===== Configuración =====
function vConf(){$('main').innerHTML=`<div class="top"><h1>Configuración</h1><button class="btn gold" onclick="uForm()">+ Nuevo usuario</button></div><div class="card" style="margin-bottom:16px"><h3>Usuarios</h3><div class="tw"><table><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th></th></tr>${db.users.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.usuario)}</td><td>${u.rol==='ADMINISTRADOR'?'Administrador':'Vendedor'}</td><td><span class="tag ${u.activo===false?'off':''}">${u.activo===false?'Inactivo':'Activo'}</span></td><td class="r"><button class="btn sm" onclick="uForm('${u.id}')">Editar</button>${u.id!==S.user.id?` <button class="btn sm ghost" onclick="uTog('${u.id}')">${u.activo===false?'Activar':'Desactivar'}</button>`:''}</td></tr>`).join('')}</table></div></div><div class="card"><h3>Cuenta y datos</h3><button class="btn" onclick="cpw()">Cambiar mi contraseña</button> <button class="btn" onclick="backup()">Descargar respaldo (JSON)</button> <button class="btn ghost danger" onclick="wipe()">Borrar todas las ventas</button></div>`}
function uForm(id){const u=id?db.users.find(x=>x.id===id):{nombre:'',usuario:'',rol:'VENDEDOR'};
 modal(`<h2>${id?'Editar':'Nuevo'} usuario</h2><label>Nombre</label><input id="un" value="${esc(u.nombre)}"><label>Usuario (para iniciar sesión)</label><input id="ue" autocapitalize="none" value="${esc(u.usuario)}" ${id?'disabled':''}>${id?'':'<label>Contraseña</label><input id="up" type="password">'}<label>Rol</label><select id="ur"><option value="VENDEDOR" ${u.rol==='VENDEDOR'?'selected':''}>Vendedor</option><option value="ADMINISTRADOR" ${u.rol==='ADMINISTRADOR'?'selected':''}>Administrador</option></select><div class="err" id="uerr"></div><button class="btn gold big" style="margin-top:14px" onclick="uSave('${id||''}')">Guardar usuario</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeM()">Cancelar</button>`)}
async function uSave(id){const n=$('un').value.trim(),e=$('ue').value.trim().toLowerCase().replace(/\s+/g,''),p=id?'':$('up').value,r=$('ur').value,x=m=>$('uerr').textContent=m;
 if(!n)return x('Escribe el nombre.');if(!id&&!/^[a-z0-9._-]{3,}$/.test(e))return x('El usuario debe tener 3 caracteres o más, sin espacios ni acentos.');if(!id&&p.length<6)return x('La contraseña debe tener al menos 6 caracteres.');
 if(id===S.user.id&&r!=='ADMINISTRADOR')return x('No puedes quitarte el rol de administrador a ti mismo.');
 try{if(id)await fs.collection('users').doc(id).update({nombre:n,rol:r});else await mkUser(e,n,p,r);closeM();toast('Usuario guardado')}
 catch(err){x(err.code==='auth/email-already-in-use'?'Ese usuario ya existe.':'No se pudo guardar el usuario.')}}
function uTog(id){if(id===S.user.id)return;const u=db.users.find(x=>x.id===id);fs.collection('users').doc(id).update({activo:u.activo===false})}
function cpw(){modal(`<h2>Cambiar contraseña</h2><label>Nueva contraseña</label><input id="np" type="password"><div class="err" id="perr"></div><button class="btn gold big" style="margin-top:14px" onclick="cpwSave()">Guardar contraseña</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeM()">Cancelar</button>`)}
async function cpwSave(){const p=$('np').value;if(p.length<6){$('perr').textContent='Debe tener al menos 6 caracteres.';return}
 try{await auth.currentUser.updatePassword(p);closeM();toast('Contraseña actualizada')}catch(e){$('perr').textContent=e.code==='auth/requires-recent-login'?'Cierra sesión, vuelve a entrar e inténtalo de nuevo.':'No se pudo cambiar la contraseña.'}}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({products:db.products,sales:db.sales})],{type:'application/json'}));a.download='respaldo-casa-del-chef-'+iso(new Date())+'.json';a.click()}
async function wipe(){if(!confirm('Se borrarán TODAS las ventas registradas. Esta acción no se puede deshacer. ¿Continuar?'))return;
 const q=await fs.collection('sales').get();for(let i=0;i<q.docs.length;i+=400){const b=fs.batch();q.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
 await fs.collection('meta').doc('counters').set({nextSale:1});toast('Ventas borradas')}
init();
</script></body></html>
