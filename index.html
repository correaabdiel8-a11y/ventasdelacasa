<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Casa del Cheff · Ventas</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#161616"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:dark;--bg:#161616;--card:#202020;--card2:#2a2a2a;--ink:#f4efe4;--mut:#9b917e;--gold:#c9a24b;--gold2:#e6c979;--line:#363636;--ok:#5fbf85;--err:#e0685a;
--mrb:none}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
body:before{content:"";position:fixed;inset:0;background:var(--mrb);opacity:.55;pointer-events:none}
.app,.login{position:relative}
h1,h2,h3,.brand{font-family:Georgia,"Times New Roman",serif;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:var(--card2)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:var(--ink);color:#0b0a09;font-weight:600;border-color:var(--ink)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold)}
.btn.big{padding:16px 22px;font-size:17px;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:#4a4028}
.btn.sm{padding:6px 10px;font-size:13px}.danger{color:var(--err)!important}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#131313}
input:focus,select:focus{border-color:var(--gold)}input[type=checkbox]{width:auto}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 5px}
.app{display:flex;min-height:100vh}
aside{width:232px;background-color:#0f0f0f;background-image:var(--mrb);border-right:1px solid #3a3121;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 0 18px;text-align:center}.lg{display:block;mix-blend-mode:lighten;margin:0 auto}
.brand .lg{width:176px;max-width:100%}
.mtop{display:none}
nav{flex:1;display:flex;flex-direction:column;gap:4px}
nav button{background:transparent;border-color:transparent;color:#cfc6b3;text-align:left;display:flex;gap:12px;align-items:center;padding:12px}
nav button.on{background:rgba(201,162,75,.12);color:var(--gold2);border-color:#4a4028}
.me{font-size:13px;padding:10px;color:#a39b8b}.me button{margin-top:8px;width:100%}
main{flex:1;padding:30px;max-width:1200px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:29px}h1:after{content:"";display:block;width:44px;height:2px;background:var(--gold);margin-top:8px}
h3{font-size:18px;margin-bottom:12px;color:var(--gold2)}
.card{background:linear-gradient(180deg,#232323,#1c1c1c);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:16px}
.k{color:var(--mut);font-size:13px}.grid4 .k{text-transform:uppercase;letter-spacing:.07em;font-size:12px}
.v{font-family:Georgia,serif;font-size:28px;margin-top:8px}.grid4 .card:first-child .v{color:var(--gold2)}
.seg{display:flex;gap:4px;background:#131313;border:1px solid var(--line);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{background:transparent;border-color:transparent;padding:8px 14px}.seg button.on{background:var(--gold);color:#0b0a09;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
tr.click{cursor:pointer}tr.click:hover{background:var(--card2)}.r{text-align:right}.tw{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:4px;height:190px}
.bar{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}.bar .t{flex:1;display:flex;align-items:flex-end}
.bar i{width:100%;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:4px 4px 0 0;min-height:2px}.bar span{font-size:10px;color:var(--mut);text-align:center;margin-top:4px}
.sale{display:grid;grid-template-columns:1fr 370px;gap:16px;align-items:start}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0}.chips button{white-space:nowrap;background:var(--card)}
.chips button.on{background:var(--gold);color:#0b0a09;border-color:var(--gold);font-weight:600}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:96px}
.p:hover{border-color:var(--gold)}.p:active{transform:scale(.98);background:var(--card2)}
.p b{font-weight:600;line-height:1.25}.p em{font-style:normal;color:var(--gold2);font-weight:700;font-family:Georgia,serif;font-size:17px}
.cart{position:sticky;top:16px;border-color:#4a4028}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.qty{display:flex;gap:4px;align-items:center}.qty button{padding:4px 10px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pay button{padding:12px 4px;background:var(--card)}.pay button.on{background:var(--gold);color:#0b0a09;border-color:var(--gold);font-weight:600}
.tot{display:flex;justify-content:space-between;font-family:Georgia,serif;font-size:27px;margin:12px 0}.tot b{color:var(--gold2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:var(--card);border:1px solid #4a4028;border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
.tag{font-size:12px;padding:3px 9px;border-radius:20px;background:rgba(201,162,75,.15);color:var(--gold2)}.tag.off{background:#2d2d2d;color:var(--mut)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--gold2);color:#0b0a09;font-weight:600;padding:12px 18px;border-radius:10px;z-index:20}
.err{color:var(--err);font-size:13px;margin-top:8px}
.login{max-width:390px;margin:6vh auto;padding:0 16px}.login .lg{width:250px;max-width:75%;margin-bottom:8px}.login .card{border-color:#4a4028}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
@media(max-width:860px){
 .app{flex-direction:column}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:7;background:#0f0f0f;border-bottom:1px solid #3a3121;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
 .mtop .lg{height:38px;margin:0}.mtop b{font-family:Georgia,serif;color:var(--gold2);font-weight:600}
 aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px;z-index:8;border-right:0;border-top:1px solid #3a3121;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
 .brand,.me{display:none}nav{flex-direction:row;justify-content:space-around}nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;text-align:center;flex:1}
 main{padding:16px 14px calc(90px + env(safe-area-inset-bottom,0px))}
 .sale{grid-template-columns:1fr}.cart{position:static}
}
#net div{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--err);color:#fff;text-align:center;padding:6px;font-size:13px}
#tk{display:none}
@media print{body:before,.app,#modal,#toast,#net{display:none!important}body{background:#fff}#tk{display:block;width:80mm;padding:4mm;color:#000;font:12px/1.35 "Courier New",monospace}#tk hr{border:0;border-top:1px dashed #000;margin:6px 0}#tk .tc{text-align:center}#tk .tr{display:flex;justify-content:space-between;gap:6px}#tk .big{font-size:15px;font-weight:700}@page{size:80mm auto;margin:0}}
button{position:relative;overflow:hidden;transition:transform .12s,filter .15s,background-color .15s,border-color .15s}
button:not(:disabled):hover{filter:brightness(1.12)}
button:not(:disabled):active{transform:scale(.95);filter:brightness(1.2)}
tr.click:active{background:#333}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.28);transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}
.btn:not(.gold):not(.ghost) .rp{background:rgba(0,0,0,.18)}
@keyframes rp{to{transform:scale(1);opacity:0}}
.who{display:flex;align-items:center;gap:10px;padding:2px 0 4px}
.who svg,.out svg{flex:none;color:var(--gold2)}
.who svg{box-sizing:content-box;padding:7px;border:1px solid #4a4028;border-radius:10px;background:rgba(201,162,75,.1)}
.who b{display:block;font-weight:600;font-size:14px;color:var(--ink)}.who small{color:var(--mut);font-size:12px}
.out{margin-left:auto;display:flex;align-items:center;gap:10px}
</style></head><body>

// Primer ingreso del admin: crea su perfil, los 43 productos y el usuario vendedor
async function bootstrap(u){
 await fs.collection('users').doc(u.uid).set({nombre:'Administrador',usuario:'admin',rol:'ADMINISTRADOR',activo:true});
 if((await fs.collection('products').limit(1).get()).empty){const b=fs.batch();SEED.forEach((p,i)=>b.set(fs.collection('products').doc(pad(i+1)),{id:pad(i+1),nombre:p[0],categoria:CATS[p[1]],precio:p[2],descripcion:'',imagen:'',activo:true}));await b.commit()}
 try{await mkUser('venta','Vendedor','ventas2026','VENDEDOR')}catch(e){console.warn(e)}}
// Crea usuarios con una segunda instancia para no cerrar la sesión del admin
async function mkUser(us,nombre,pw,rol){const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
 const c=await sec.auth().createUserWithEmailAndPassword(em(us),pw);
 try{await fs.collection('users').doc(c.user.uid).set({nombre,usuario:us,rol,activo:true})}finally{await sec.auth().signOut()}}
function listen(){const sl=fs.collection('sales');
 unsubs.push(fs.collection('products').onSnapshot(s=>{db.products=s.docs.map(x=>x.data()).sort((a,b)=>a.id<b.id?-1:1);refresh()}));
 unsubs.push((isA()?sl:sl.where('fecha','==',iso(new Date()))).onSnapshot(s=>{db.sales=s.docs.map(x=>x.data()).sort((a,b)=>a.id-b.id);refresh()}));
 unsubs.push(fs.collection('cortes').onSnapshot(q=>{db.cortes=q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.id<b.id?1:-1);refresh()}));
 if(isA())unsubs.push(fs.collection('users').onSnapshot(s=>{db.users=s.docs.map(x=>({id:x.id,...x.data()}));refresh()}))}

 (hist.length?`<div class="card"><h3>Cortes anteriores</h3><div class="tw"><table><tr><th>Fecha</th><th>Fondo</th><th>Esperado</th><th>Contado</th><th class="r">Diferencia</th><th>Cerró</th></tr>${hist.map(x=>`<tr><td>${fd(x.id)}</td><td>${money(x.fondo)}</td><td>${money(x.esperado)}</td><td>${money(x.contado)}</td><td class="r"><b style="color:${col(x.dif)}">${money(x.dif)}</b></td><td>${esc(x.cerradoPor)}</td></tr>`).join('')}</table></div></div>`:'')}
function difC(e){const v=parseFloat($('cc').value);$('cd').textContent=isNaN(v)?'—':money(v-e)}
function openCaja(){const f=parseFloat($('cf').value),d=iso(new Date());if(!(f>=0)){toast('Escribe el fondo inicial.');return}fs.collection('cortes').doc(d).set({fecha:d,fondo:f,abiertoPor:S.user.nombre,cerrado:false}).catch(()=>toast('No se pudo abrir la caja.'))}
function closeCaja(e){const v=parseFloat($('cc').value);if(isNaN(v)||v<0){toast('Escribe el efectivo contado.');return}if(!confirm('¿Cerrar la caja con '+money(v)+' contados?'))return;
 fs.collection('cortes').doc(iso(new Date())).update({cerrado:true,contado:v,esperado:e,dif:Math.round((v-e)*100)/100,cerradoPor:S.user.nombre,hora:new Date().toTimeString().slice(0,5)}).catch(()=>toast('No se pudo cerrar la caja.'))}
// ===== Productos =====
function vProd(){const a=isA();$('main').innerHTML=`<div class="top"><h1>Productos</h1>${a?'<div><button class="btn ghost" onclick="priceLog()">Historial de precios</button> <button class="btn gold" onclick="pForm()">+ Nuevo producto</button></div>':''}</div><div class="card"><div class="tw"><table><tr><th>ID</th><th>Producto</th><th>Categoría</th><th class="r">Precio</th><th>Estado</th>${a?'<th></th>':''}</tr>${db.products.map(p=>`<tr><td class="k">${p.id}</td><td><b>${p.fav?'★ ':''}${esc(p.nombre)}</b><div class="k">${esc(p.descripcion)}</div></td><td>${p.categoria}</td><td class="r">${money(p.precio)}</td><td><span class="tag ${p.activo?'':'off'}">${p.activo?'Activo':'Inactivo'}</span></td>${a?`<td class="r"><button class="btn sm" onclick="pForm('${p.id}')">Editar</button> <button class="btn sm ghost" onclick="pTog('${p.id}')">${p.activo?'Desactivar':'Activar'}</button></td>`:''}</tr>`).join('')}</table></div></div>`}
function pForm(id){if(!isA())return;const p=id?prod(id):{nombre:'',categoria:CATS[0],precio:'',descripcion:'',imagen:'',activo:true};
 modal(`<h2>${id?'Editar':'Nuevo'} producto</h2><label>Nombre</label><input id="fn" value="${esc(p.nombre)}"><div class="two"><div><label>Categoría</label><select id="fc">${CATS.map(c=>`<option ${c===p.categoria?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Precio (MXN)</label><input id="fp" type="number" min="0.01" step="0.5" value="${p.precio}"></div></div><label>Descripción</label><input id="fd" value="${esc(p.descripcion)}"><label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="fa" style="width:auto" ${p.activo?'checked':''}> Activo (aparece al vender)</label><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="ff" style="width:auto" ${p.fav?'checked':''}> ★ Favorito (aparece primero)</label><div class="err" id="ferr"></div><button class="btn gold big" style="margin-top:14px" onclick="pSave('${id||''}')">Guardar producto</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeM()">Cancelar</button>`)}
async function pSave(id){const n=$('fn').value.trim(),pr=parseFloat($('fp').value);
 if(!n){$('ferr').textContent='Escribe el nombre del producto.';return}if(!(pr>0)){$('ferr').textContent='El precio debe ser mayor a $0.';return}
 const d={nombre:n,categoria:$('fc').value,precio:pr,descripcion:$('fd').value.trim(),activo:$('fa').checked,fav:$('ff').checked};
 try{if(id){const o=prod(id);if(o.precio!==pr)logPrice(o,pr,n);await fs.collection('products').doc(id).update(d)}else{const nid=pad(Math.max(0,...db.products.map(p=>+p.id.slice(1)))+1);await fs.collection('products').doc(nid).set({id:nid,...d})}
 closeM();toast('Producto guardado')}catch(e){$('ferr').textContent='No se pudo guardar. Revisa tu conexión.'}}
function pTog(id){if(!isA())return;S.cart=S.cart.filter(c=>c.id!==id);fs.collection('products').doc(id).update({activo:!prod(id).activo})}
function logPrice(o,n,name){const t=new Date();fs.collection('cambios_precio').add({ts:Date.now(),fecha:iso(t),hora:t.toTimeString().slice(0,5),productoId:o.id,nombre:name,anterior:o.precio,nuevo:n,usuario:S.user.nombre}).catch(()=>{})}
async function priceLog(){const q=await fs.collection('cambios_precio').orderBy('ts','desc').limit(60).get();
 modal(`<h2>Historial de precios</h2><div style="margin:12px 0;max-height:55vh;overflow:auto">${q.empty?'<p class="k">Aún no hay cambios de precio.</p>':q.docs.map(d=>d.data()).map(c=>`<div class="row" style="border-bottom:1px solid var(--line)"><span><b>${esc(c.nombre)}</b><div class="k">${fd(c.fecha)} ${c.hora} · ${esc(c.usuario)}</div></span><span>${money(c.anterior)} → <b>${money(c.nuevo)}</b></span></div>`).join('')}</div><button class="btn" style="width:100%" onclick="closeM()">Cerrar</button>`)}
// ===== Historial =====
function vHist(){$('main').innerHTML=`<div class="top"><h1>Historial de ventas</h1><button class="btn ghost" onclick="xl(S.hl||[],'historial-ventas')">Exportar a Excel</button></div><div class="card"><div class="filters"><input id="hq" placeholder="Buscar # o producto" value="${esc(S.hf.q)}" oninput="S.hf.q=this.value;hRows()"><div><input id="h1" type="date" value="${S.hf.d1}" onchange="S.hf.d1=this.value;hRows()" title="Desde"></div><div><input id="h2" type="date" value="${S.hf.d2}" onchange="S.hf.d2=this.value;hRows()" title="Hasta"></div><select onchange="S.hf.m=this.value;hRows()"><option value="">Todos los pagos</option>${PAYS.map(m=>`<option ${S.hf.m===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="tw"><table><tr><th>Fecha</th><th>Hora</th><th>Venta</th><th>Productos</th><th>Pago</th><th class="r">Total</th></tr><tbody id="hb"></tbody></table></div><p class="k" id="hs" style="margin-top:10px"></p></div>`;hRows()}
function hRows(){const f=S.hf,q=f.q.toLowerCase().replace('#','');
 const L=db.sales.filter(s=>(!f.d1||s.fecha>=f.d1)&&(!f.d2||s.fecha<=f.d2)&&(!f.m||s.metodo===f.m)&&(!q||String(s.id)===q||itemsTxt(s).toLowerCase().includes(q))).reverse();
 S.hl=L;$('hb').innerHTML=L.slice(0,300).map(s=>`<tr class="click" onclick="detail(${s.id})"><td>${fd(s.fecha)}</td><td>${s.hora}</td><td>${fn(s.id)}</td><td>${esc(itemsTxt(s))}</td><td>${s.metodo}${s.estado==='cancelada'?' <span class="tag off">Cancelada</span>':''}</td><td class="r"><b>${money(s.total)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="k">No hay ventas con estos filtros.</td></tr>';
 $('hs').textContent=L.length+' ventas · '+money(L.filter(s=>s.estado!=='cancelada').reduce((a,s)=>a+s.total,0))+(L.length>300?' (se muestran las 300 más recientes)':'')}
// ===== Reportes =====
function prevR(p){const[a,b]=range(p),d=new Date(a+'T12:00'),n=Math.round((new Date(b+'T12:00')-d)/864e5)+1,pb=new Date(d);pb.setDate(pb.getDate()-1);const pa=new Date(pb);pa.setDate(pa.getDate()-n+1);return[iso(pa),iso(pb)]}
function agg(L,f){const m={};L.forEach(s=>f(s).forEach(([k,v])=>m[k]=(m[k]||0)+v));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function prog(A){const mt=Math.max(...A.map(m=>m[1]),1);return A.length?A.map(m=>`<div style="margin:10px 0"><div class="row"><span>${esc(m[0])}</span><b>${money(m[1])}</b></div><div style="background:var(--line);border-radius:6px;height:8px"><div style="background:var(--gold);height:8px;border-radius:6px;width:${m[1]/mt*100}%"></div></div></div>`).join(''):'<p class="k">Sin datos.</p>'}
function vRep(){const L=salesIn(S.per),s=stats(L),[pa,pb]=prevR(S.per),ps=stats(db.sales.filter(x=>x.fecha>=pa&&x.fecha<=pb&&x.estado!=='cancelada')),dl=ps.tot?(s.tot-ps.tot)/ps.tot*100:null,cat=Object.fromEntries(db.products.map(p=>[p.id,p.categoria])),hr=Array(24).fill(0);
 L.forEach(x=>hr[+x.hora.slice(0,2)]+=x.total);const H=hr.map((v,h)=>[h+':00',v,h]).filter(x=>x[2]>=6&&x[2]<=22),u=S.per==='hoy'||S.per==='ayer'?'hora':'día';
 $('main').innerHTML=`<div class="top"><h1>Reportes</h1><div style="display:flex;gap:8px;flex-wrap:wrap">${seg(S.per,'setRep')}<button class="btn ghost" onclick="exportRep()">Exportar a Excel</button></div></div>
 ${S.per==='rango'?`<div class="filters"><div><label>Desde</label><input type="date" value="${S.r1||''}" onchange="S.r1=this.value;vRep()"></div><div><label>Hasta</label><input type="date" value="${S.r2||''}" onchange="S.r2=this.value;vRep()"></div></div>`:''}
 <div class="grid4"><div class="card"><div class="k">Ventas del período</div><div class="v">${money(s.tot)}</div><div class="k" style="margin-top:6px;text-transform:none;letter-spacing:0;color:${dl==null?'var(--mut)':dl>=0?'var(--ok)':'var(--err)'}">${dl==null?'Sin periodo anterior para comparar':(dl>=0?'▲ ':'▼ ')+Math.abs(dl).toFixed(1)+'% vs periodo anterior ('+money(ps.tot)+')'}</div></div><div class="card"><div class="k">Promedio por venta</div><div class="v">${money(s.avg)}</div></div><div class="card"><div class="k">Producto más vendido</div><div class="v">${s.top[0]?esc(s.top[0][0]):'—'}</div></div><div class="card"><div class="k">Pago más utilizado</div><div class="v">${s.me[0]?s.me[0][0]:'—'}</div></div></div>
 <div class="card" style="margin-bottom:16px"><h3>Ventas por ${u}</h3>${s.n?bars(series(L,S.per)):'<p class="k">No hay ventas en este período.</p>'}</div>
 <div class="grid2"><div class="card"><h3>Por método de pago</h3>${prog(s.me)}</div><div class="card"><h3>Productos más vendidos</h3>${s.top.slice(0,10).map((t,i)=>`<div class="row"><span>${i+1}. ${esc(t[0])}</span><b>${t[1]}</b></div>`).join('')||'<p class="k">Sin datos.</p>'}</div></div>
 <div class="grid2"><div class="card"><h3>Por categoría</h3>${prog(agg(L,x=>x.items.map(i=>[cat[i.productoId]||'Otros',i.sub])))}</div><div class="card"><h3>Por vendedor</h3>${prog(agg(L,x=>[[x.vendedor||'—',x.total]]))}</div></div>
 <div class="card"><h3>Horas con más ventas</h3>${s.n?bars(H):'<p class="k">Sin datos.</p>'}</div>`}
function setRep(p){S.per=p;vRep()}
// ===== Configuración =====
function vConf(){$('main').innerHTML=`<div class="top"><h1>Configuración</h1><button class="btn gold" onclick="uForm()">+ Nuevo usuario</button></div><div class="card" style="margin-bottom:16px"><h3>Usuarios</h3><div class="tw"><table><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th></th></tr>${db.users.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.usuario)}</td><td>${u.rol==='ADMINISTRADOR'?'Administrador':'Vendedor'}</td><td><span class="tag ${u.activo===false?'off':''}">${u.activo===false?'Inactivo':'Activo'}</span></td><td class="r"><button class="btn sm" onclick="uForm('${u.id}')">Editar</button>${u.id!==S.user.id?` <button class="btn sm ghost" onclick="uTog('${u.id}')">${u.activo===false?'Activar':'Desactivar'}</button>`:''}</td></tr>`).join('')}</table></div></div><div class="card"><h3>Cuenta y datos</h3><button class="btn" onclick="cpw()">Cambiar mi contraseña</button> <button class="btn" onclick="backup()">Descargar respaldo (JSON)</button> <button class="btn ghost danger" onclick="wipe()">Borrar todas las ventas</button></div>`}
function uForm(id){const u=id?db.users.find(x=>x.id===id):{nombre:'',usuario:'',rol:'VENDEDOR'};
 modal(`<h2>${id?'Editar':'Nuevo'} usuario</h2><label>Nombre</label><input id="un" value="${esc(u.nombre)}"><label>Usuario (para iniciar sesión)</label><input id="ue" autocapitalize="none" value="${esc(u.usuario)}" ${id?'disabled':''}>${id?'':'<label>Contraseña</label><input id="up" type="password">'}<label>Rol</label><select id="ur"><option value="VENDEDOR" ${u.rol==='VENDEDOR'?'selected':''}>Vendedor</option><option value="ADMINISTRADOR" ${u.rol==='ADMINISTRADOR'?'selected':''}>Administrador</option></select><div class="err" id="uerr"></div><button class="btn gold big" style="margin-top:14px" onclick="uSave('${id||''}')">Guardar usuario</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeM()">Cancelar</button>`)}
async function uSave(id){const n=$('un').value.trim(),e=$('ue').value.trim().toLowerCase().replace(/\s+/g,''),p=id?'':$('up').value,r=$('ur').value,x=m=>$('uerr').textContent=m;
 if(!n)return x('Escribe el nombre.');if(!id&&!/^[a-z0-9._-]{3,}$/.test(e))return x('El usuario debe tener 3 caracteres o más, sin espacios ni acentos.');if(!id&&p.length<6)return x('La contraseña debe tener al menos 6 caracteres.');
 if(id===S.user.id&&r!=='ADMINISTRADOR')return x('No puedes quitarte el rol de administrador a ti mismo.');
 try{if(id)await fs.collection('users').doc(id).update({nombre:n,rol:r});else await mkUser(e,n,p,r);closeM();toast('Usuario guardado')}
 catch(err){x(err.code==='auth/email-already-in-use'?'Ese usuario ya existe.':'No se pudo guardar el usuario.')}}
function uTog(id){if(id===S.user.id)return;const u=db.users.find(x=>x.id===id);fs.collection('users').doc(id).update({activo:u.activo===false})}
function cpw(){modal(`<h2>Cambiar contraseña</h2><label>Nueva contraseña</label><input id="np" type="password"><div class="err" id="perr"></div><button class="btn gold big" style="margin-top:14px" onclick="cpwSave()">Guardar contraseña</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeM()">Cancelar</button>`)}
async function cpwSave(){const p=$('np').value;if(p.length<6){$('perr').textContent='Debe tener al menos 6 caracteres.';return}
 try{await auth.currentUser.updatePassword(p);closeM();toast('Contraseña actualizada')}catch(e){$('perr').textContent=e.code==='auth/requires-recent-login'?'Cierra sesión, vuelve a entrar e inténtalo de nuevo.':'No se pudo cambiar la contraseña.'}}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({products:db.products,sales:db.sales})],{type:'application/json'}));a.download='respaldo-casa-del-chef-'+iso(new Date())+'.json';a.click()}
async function wipe(){if(!confirm('Se borrarán TODAS las ventas registradas. Esta acción no se puede deshacer. ¿Continuar?'))return;
 const q=await fs.collection('sales').get();for(let i=0;i<q.docs.length;i+=400){const b=fs.batch();q.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
 await fs.collection('meta').doc('counters').set({nextSale:1});toast('Ventas borradas')}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,x=document.createElement('span');x.className='rp';x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(x);setTimeout(()=>x.remove(),550)});
function net(){$('net').innerHTML=navigator.onLine?'':'<div>Sin conexión: puedes seguir vendiendo; las ventas se enviarán al volver internet.</div>'}
addEventListener('online',net);addEventListener('offline',net);net();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script></body></html>
